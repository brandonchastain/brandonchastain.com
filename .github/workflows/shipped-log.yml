name: Shipped log (weekly)

# Writes shipped/weeks/YYYY-Www.md and regenerates shipped/index.html, then commits to master.
# The commit is pushed with SHIPPED_LOG_TOKEN (a PAT), not the built-in GITHUB_TOKEN, so the push
# triggers the Azure Static Web Apps deploy workflows like any other push to master.

on:
  schedule:
    # Sunday 6pm Pacific is Monday 01:00 UTC (PDT) or 02:00 UTC (PST). 02:00 never fires before Sunday 6pm.
    - cron: "0 2 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the markdown instead of committing and notifying"
        type: boolean
        default: false
      end:
        description: "Optional window end (YYYY-MM-DD); defaults to now"
        required: false

concurrency:
  group: shipped-log
  cancel-in-progress: false

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.SHIPPED_LOG_TOKEN }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Run
        env:
          GITHUB_TOKEN: ${{ secrets.SHIPPED_LOG_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_ACCESS_TOKEN: ${{ secrets.NTFY_ACCESS_TOKEN }}
          SITE_URL: https://brandonchastain.com
          DRY_RUN: ${{ inputs.dry_run }}
          WINDOW_END: ${{ inputs.end }}
        run: |
          ARGS="--out $GITHUB_WORKSPACE"
          if [ "$DRY_RUN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "$WINDOW_END" ]; then ARGS="$ARGS --end $WINDOW_END"; fi
          dotnet run --project tools/shipped-log/src/ShippedLog -c Release -- $ARGS

      - name: Commit
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "shipped-log bot"
          git config user.email "actions@users.noreply.github.com"
          git add shipped
          if git diff --cached --quiet; then echo "Nothing to commit"; exit 0; fi
          git commit -m "Shipped log $(ls shipped/weeks | sort | tail -n1 | sed 's/.md$//')"
          git push
